events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Proxy cache for Rajaongkir responses
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=rajaongkir:10m max_size=50m inactive=1h use_temp_path=off;
    
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        
        # Cache static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
        
        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Rajaongkir API proxy - bypasses network restrictions
        location /api/rajaongkir/ {
            # Allow CORS from any origin
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, key' always;
            
            # Handle preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            proxy_pass https://api.rajaongkir.com/starter/;
            proxy_cache rajaongkir;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout updating;
            
            # Extended timeouts for external API
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Pass headers
            proxy_set_header Host "api.rajaongkir.com";
            proxy_set_header key "6257ae210b00dfa4d6cda76747341c7a";
        }
    }
}
