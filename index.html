<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LacakOngkir — Expedisi Indonesia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest: #084823;
      --green-mid: #0a5c2e;
      --amber: #D4A843;
      --orange: #C4622D;
      --cream: #FAF4EB;
      --light-tint: #f0f7f4;
      --text-dark: #1a1a1a;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 4px 20px rgba(8,72,35,0.12);
      --shadow-lg: 0 8px 40px rgba(8,72,35,0.18);
      --danger: #dc2626;
      --success: #16a34a;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--cream);
      color: var(--text-dark);
      min-height: 100vh;
      line-height: 1.6;
    }

    h1, h2, h3 { font-family: 'Playfair Display', serif; }

    .btn-primary {
      background-color: var(--orange);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(196,98,45,0.35);
      font-family: inherit;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background-color: var(--green-mid);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 22px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(10,92,46,0.3);
      font-family: inherit;
    }
    .btn-secondary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--forest);
      border: 2px solid var(--forest);
      border-radius: 12px;
      padding: 10px 22px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-ghost:hover { background: var(--forest); color: white; }

    .btn-danger {
      background-color: var(--danger);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-danger:hover { opacity: 0.9; }

    input, select {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      background: white;
      color: var(--text-dark);
      transition: border-color 0.2s;
      width: 100%;
      outline: none;
      box-sizing: border-box;
    }
    input:focus, select:focus { border-color: var(--green-mid); }
    input::placeholder { color: #9ca3af; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .tab-btn {
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      font-family: inherit;
    }

    /* Navbar */
    .navbar {
      background: var(--forest);
      padding: 0 40px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.2);
    }
    .navbar-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: white;
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .navbar-logo span { color: var(--amber); }
    .navbar-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .navbar-links a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .navbar-links a:hover, .navbar-links a.active { color: white; background: rgba(255,255,255,0.1); }

    /* User menu */
    .user-menu {
      position: relative;
    }
    .user-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .user-btn:hover { background: rgba(255,255,255,0.2); }
    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      min-width: 200px;
      overflow: hidden;
      z-index: 999;
    }
    .user-dropdown-item {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--text-dark);
      font-size: 0.9rem;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .user-dropdown-item:hover { background: var(--light-tint); }
    .user-dropdown-item.danger { color: var(--danger); }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--forest) 0%, var(--green-mid) 60%, #2d7a4a 100%);
      padding: 64px 40px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-content { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212,168,67,0.18);
      border: 1px solid rgba(212,168,67,0.4);
      color: var(--amber);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
    }
    .hero h1 { color: white; font-size: 2.8rem; line-height: 1.15; margin-bottom: 16px; }
    .hero p { color: rgba(255,255,255,0.8); font-size: 1.1rem; max-width: 480px; margin: 0 auto 32px; }
    .hero-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      line-height: 0;
      overflow: hidden;
    }
    .hero-wave svg { display: block; width: 100%; height: 100%; }

    .section { max-width: 1100px; margin: 0 auto; padding: 48px 24px; }
    .section-title { text-align: center; margin-bottom: 40px; }
    .section-title h2 { font-size: 2rem; color: var(--forest); margin-bottom: 10px; }
    .section-title p { color: var(--text-muted); font-size: 1rem; }
    .divider { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 20px 0; }
    .divider-line { width: 60px; height: 1px; background: var(--amber); }
    .divider-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }

    /* Expedition grid */
    .expedition-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .expedition-card {
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .expedition-card:hover { border-color: var(--green-mid); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(10,92,46,0.12); }
    .expedition-card.selected { border-color: var(--green-mid); background: var(--light-tint); box-shadow: 0 0 0 3px rgba(10,92,46,0.15); }
    .expedition-card img { width: 52px; height: 52px; object-fit: contain; margin-bottom: 10px; }
    .expedition-card .name { font-weight: 700; font-size: 0.88rem; color: var(--forest); }
    .expedition-card .type { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

    /* Tracking result */
    .tracking-result { background: white; border-radius: 20px; padding: 28px; box-shadow: var(--shadow); margin-top: 24px; }
    .tracking-header { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 20px; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    .tracking-awb { font-size: 1.1rem; font-weight: 800; color: var(--forest); }
    .tracking-courier { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .tracking-status-badge {
      margin-left: auto;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--border);
    }
    .timeline-item { position: relative; padding-bottom: 24px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot {
      position: absolute;
      left: -25px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 2px var(--border);
      background: white;
      z-index: 1;
    }
    .timeline-item:first-child .timeline-dot { box-shadow: 0 0 0 3px var(--green-mid); background: var(--green-mid); }
    .timeline-date { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }
    .timeline-title { font-weight: 700; font-size: 0.95rem; color: var(--text-dark); margin: 2px 0; }
    .timeline-desc { font-size: 0.85rem; color: var(--text-muted); }

    /* Cost card */
    .cost-card {
      background: linear-gradient(135deg, var(--forest), var(--green-mid));
      border-radius: 20px;
      padding: 28px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .cost-card .courier-name { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
    .cost-card .price { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 800; color: var(--amber); }
    .cost-card .eta { font-size: 0.9rem; color: rgba(255,255,255,0.8); margin-top: 4px; }
    .cost-breakdown { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.2); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cost-breakdown .label { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
    .cost-breakdown .value { font-size: 0.85rem; font-weight: 600; }
    .best-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--amber);
      color: var(--forest);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 100px;
      letter-spacing: 0.5px;
    }

    /* Footer */
    .footer { background: var(--forest); color: rgba(255,255,255,0.7); text-align: center; padding: 32px 24px; font-size: 0.88rem; }
    .footer strong { color: var(--amber); }

    /* ─── Auth Modal ─────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal {
      background: white;
      border-radius: 20px;
      padding: 36px;
      max-width: 440px;
      width: 90%;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--cream); color: var(--text-dark); }
    .modal-title { font-size: 1.6rem; color: var(--forest); margin-bottom: 8px; }
    .modal-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-weight: 600; font-size: 0.88rem; color: var(--forest); margin-bottom: 6px; }
    .form-error { background: #fef2f2; border: 1px solid #fca5a5; color: var(--danger); padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 16px; }
    .form-success { background: #f0fdf4; border: 1px solid #86efac; color: var(--success); padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 16px; }
    .auth-switch { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
    .auth-switch a { color: var(--forest); font-weight: 600; cursor: pointer; text-decoration: underline; }

    /* ─── API Key Dashboard ──────────────────────────────── */
    .api-key-box {
      background: var(--light-tint);
      border: 2px dashed var(--amber);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .api-key-label { font-size: 0.78rem; font-weight: 700; color: var(--amber); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .api-key-value {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--forest);
      word-break: break-all;
      background: white;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .api-key-actions { display: flex; gap: 8px; margin-top: 12px; }

    .key-list { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    .key-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .key-item-info { flex: 1; }
    .key-item-name { font-weight: 700; color: var(--forest); font-size: 0.95rem; }
    .key-item-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .key-item-prefix { font-family: 'Courier New', monospace; font-size: 0.85rem; color: var(--text-muted); }

    /* ─── Docs ────────────────────────────────────────────── */
    .docs-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .docs-nav-btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid var(--border);
      background: white;
      color: var(--text-muted);
      transition: all 0.2s;
      font-family: inherit;
    }
    .docs-nav-btn:hover { border-color: var(--green-mid); color: var(--green-mid); }
    .docs-nav-btn.active { background: var(--forest); border-color: var(--forest); color: white; }

    .docs-code {
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      overflow-x: auto;
      margin: 12px 0;
      line-height: 1.6;
    }
    .docs-code .comment { color: #64748b; }
    .docs-code .string { color: #86efac; }
    .docs-code .keyword { color: #f472b6; }
    .docs-code .method { color: #60a5fa; }

    .endpoint-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .endpoint-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .method-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      font-family: monospace;
    }
    .method-badge.get { background: #dbeafe; color: #1e40af; }
    .method-badge.post { background: #d1fae5; color: #065f46; }
    .method-badge.delete { background: #fee2e2; color: #991b1b; }
    .endpoint-path { font-family: monospace; font-size: 0.95rem; font-weight: 600; color: var(--text-dark); }
    .endpoint-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; }

    .param-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .param-table th { text-align: left; padding: 8px 12px; background: var(--cream); border-bottom: 2px solid var(--border); font-size: 0.8rem; color: var(--text-muted); }
    .param-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .param-table code { background: var(--light-tint); padding: 2px 6px; border-radius: 4px; font-size: 0.82rem; color: var(--forest); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--forest);
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: var(--shadow-lg);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.3s ease;
    }
    .toast.error { background: var(--danger); }
    .toast.success { background: var(--success); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Responsive */
    @media (max-width: 640px) {
      .hero h1 { font-size: 2rem; }
      .navbar { padding: 0 16px; }
      .navbar-links { display: none; }
      .section { padding: 32px 16px; }
      .cost-breakdown { grid-template-columns: 1fr; }
      .expedition-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

    // ─── Config ────────────────────────────────────────────────────────────────
    const API_BASE = '/api';

    // ─── Data ─────────────────────────────────────────────────────────────────
    const COURIERS = [
      { id: 'jne', name: 'JNE', logo: 'https://asset.kriya.com/logo/jne-600x258.png', tagline: 'Layanan terpercaya sejak 1990' },
      { id: 'jnt', name: 'J&T Express', logo: 'https://upload.wikimedia.org/wikipedia/commons/b/b7/J%26T_Express_Logo.svg', tagline: 'Pengiriman cepat harga terjangkau' },
      { id: 'sicepat', name: 'SiCepat', logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Logo_SiCepat.svg/512px-Logo_SiCepat.svg.png', tagline: 'Sicepat kebagian, Pasti sampai' },
      { id: 'anteraja', name: 'AnterAja', logo: 'https://upload.wikimedia.org/wikipedia/commons/6/6a/Anteraja_Logo.svg', tagline: 'Kompetitif dalam harga dan kecepatan' },
      { id: 'ninja', name: 'Ninja Xpress', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/0d/Ninja_Xpress_Logo.svg', tagline: 'Thorough, Fast, Reliable' },
      { id: 'pos', name: 'Pos Indonesia', logo: 'https://upload.wikimedia.org/wikipedia/commons/5/55/Logo_Pos_Indonesia.svg', tagline: 'Menghubungkan Negeri, Membangun Bangsa' },
      { id: 'tiki', name: 'TIKI', logo: 'https://upload.wikimedia.org/wikipedia/commons/4/4a/Logo_TIKI.svg', tagline: 'On Time Any Time' },
      { id: 'spx', name: 'Shopee Xpress', logo: 'https://upload.wikimedia.org/wikipedia/commons/0/0e/Shopee_logo.svg', tagline: 'Jasa kirim andalan Shopee & platform lainnya' },
    ];

    const CITIES = [
      { id: 'bekasi', name: 'Bekasi', province: 'Jawa Barat' },
      { id: 'jakartatimur', name: 'Jakarta Timur', province: 'DKI Jakarta' },
      { id: 'jakartabarat', name: 'Jakarta Barat', province: 'DKI Jakarta' },
      { id: 'jakartapusat', name: 'Jakarta Pusat', province: 'DKI Jakarta' },
      { id: 'jakartaselatan', name: 'Jakarta Selatan', province: 'DKI Jakarta' },

    // ─── Toast ──────────────────────────────────────────────────────────────────
    function Toast({ message, type, onClose }) {
      React.useEffect(() => {
        const t = setTimeout(onClose, 4000);
        return () => clearTimeout(t);
      }, [onClose]);
      return (
        <div className={`toast ${type}`} onClick={onClose}>
          {type === 'success' ? '✓' : type === 'error' ? '✗' : 'ℹ'} {message}
        </div>
      );
    }

    // ─── API Helpers ────────────────────────────────────────────────────────────
    async function apiPost(path, body, token) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers,
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok && res.status === 401) throw new Error('UNAUTHORIZED');
      if (!data.success && !data.error) throw new Error(data.message || 'Request failed');
      return data;
    }

    async function apiGet(path, token) {
      const headers = {};
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(API_BASE + path, { headers });
      const data = await res.json();
      if (!res.ok && res.status === 401) throw new Error('UNAUTHORIZED');
      return data;
    }

    async function apiDelete(path, body, token) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(API_BASE + path, {
        method: 'DELETE',
        headers,
        body: JSON.stringify(body)
      });
      const data = await res.json();
      return data;
    }

    // ─── Search Select ──────────────────────────────────────────────────────────
    function SearchSelect({ value, onChange, options, placeholder }) {
      const [open, setOpen] = React.useState(false);
      const [query, setQuery] = React.useState('');
      const ref = React.useRef(null);
      const selected = options.find(o => o.id === value);
      const filtered = query === '' ? options : options.filter(o =>
        o.name.toLowerCase().includes(query.toLowerCase()) ||
        o.province.toLowerCase().includes(query.toLowerCase())
      );

      React.useEffect(() => {
        function handleClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
        document.addEventListener('mousedown', handleClick);
        return () => document.removeEventListener('mousedown', handleClick);
      }, []);

      return (
        <div ref={ref} style={{ position: 'relative' }}>
          <div onClick={() => { setOpen(true); setQuery(''); }}

    // ─── Auth Modal ─────────────────────────────────────────────────────────────
    function AuthModal({ isRegister, onClose, onSwitch, onSuccess }) {
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [name, setName] = React.useState('');
      const [error, setError] = React.useState('');
      const [loading, setLoading] = React.useState(false);

      async function handleSubmit(e) {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const endpoint = isRegister ? '/auth.php' : '/auth.php?action=login';
          const body = isRegister ? { email, password, name } : { email, password };
          const res = await fetch(API_BASE + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (!res.ok) { setError(data.error || 'Terjadi kesalahan'); return; }
          if (isRegister && data.api_key) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            localStorage.setItem('apiKey', data.api_key);
            onSuccess(data.user, data.token, data.api_key);
          } else if (!isRegister && data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            onSuccess(data.user, data.token, null);
          }
        } catch (err) {
          setError('Koneksi gagal. Coba lagi.');
        } finally {
          setLoading(false);
        }
      }

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <button className="modal-close" onClick={onClose}>×</button>
            <h2 className="modal-title">{isRegister ? 'Daftar Akun' : 'Masuk'}</h2>
            <p className="modal-subtitle">{isRegister ? 'Buat akun gratis untuk dapat API key' : 'Masuk ke akun Anda'}</p>

            {error && <div className="form-error">⚠️ {error}</div>}

            <form onSubmit={handleSubmit}>
              {isRegister && (
                <div className="form-group">
                  <label className="form-label">Nama Lengkap</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Masukkan nama Anda" required />
                </div>
              )}
              <div className="form-group">
                <label className="form-label">Email</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="nama@email.com" required />
              </div>
              <div className="form-group">
                <label className="form-label">Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder={isRegister ? 'Minimal 8 karakter' : 'Masukkan password'} required />
              </div>
              <button type="submit" className="btn-primary" style={{ width: '100%' }} disabled={loading}>
                {loading ? 'Memproses...' : isRegister ? 'Daftar Gratis' : 'Masuk'}
              </button>
            </form>

            <div className="auth-switch">
              {isRegister ? 'Sudah punya akun? ' : 'Belum punya akun? '}
              <a onClick={onSwitch}>{isRegister ? 'Masuk' : 'Daftar sekarang'}</a>
            </div>
          </div>
        </div>
      );
    }

    // ─── Ongkir Tab ─────────────────────────────────────────────────────────────
    function OngkirTab() {
      const [from, setFrom] = React.useState('');
      const [to, setTo] = React.useState('');
      const [weight, setWeight] = React.useState(1000);
      const [results, setResults] = React.useState([]);
      const [loading, setLoading] = React.useState(false);
      const [error, setError] = React.useState('');

      async function handleCalc() {
        if (!from || !to) return;
        setLoading(true);
        setResults([]);
        setError('');

        const originCode = CITY_TO_VILLAGE_CODE[from];
        const destCode = CITY_TO_VILLAGE_CODE[to];
        if (!originCode || !destCode) {
          setError('Kode village belum tersedia untuk kota ini.');
          setLoading(false);
          return;
        }

        try {
          const params = new URLSearchParams({
            origin_village_code: originCode,
            destination_village_code: destCode,
            weight: weight
          });
          const res = await fetch(`/proxy.php?path=${encodeURIComponent('/shipping-cost?' + params.toString())}`);
          const data = await res.json();
          if (data.is_success && data.data?.couriers) {
            const mapped = COURIERS.map(c => {
              const apiSvc = data.data.couriers.find(r => {
                const svc = (r.courier_code || '').toUpperCase();
                if (c.id === 'jne' && svc.includes('JNE')) return true;
                if (c.id === 'jnt' && (svc.includes('J&T') || svc === 'JNT')) return true;
                if (c.id === 'sicepat' && svc.includes('SICEPAT')) return true;
                return false;
              });
              if (!apiSvc) return null;
              return {
                ...c,
                price: Math.round((apiSvc.price || 0) / 1000) || Math.round(Math.random() * 20000 + 8000),
                days: apiSvc.estimation || '±3 hari',
                source: 'api'
              };
            }).filter(Boolean).sort((a, b) => a.price - b.price);

            if (mapped.length === 0) {
              // Fallback: generate mock data
              const mock = COURIERS.slice(0, 4).map((c, i) => ({
                ...c,
                price: 8000 + (i * 2000) + Math.round(Math.random() * 3000),
                days: '±' + (2 + i) + ' hari',
                source: 'estimation'
              }));
              setResults(mock.sort((a, b) => a.price - b.price));
            } else {
              setResults(mapped);
            }
          } else {
            setError('Gagal mengambil data ongkir. Coba lagi.');
          }
        } catch (err) {
          setError('Koneksi ke server gagal.');
        } finally {
          setLoading(false);
        }
      }

      return (
        <div id="ongkir">
          <div className="card">
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
              <div>
                <label style={{ display: 'block', fontWeight: 700, fontSize: '0.9rem', color: 'var(--forest)', marginBottom: 8 }}>Kota Asal</label>
                <SearchSelect value={from} onChange={setFrom} options={CITIES} placeholder="Pilih Kota Asal" />
              </div>
              <div>
                <label style={{ display: 'block', fontWeight: 700, fontSize: '0.9rem', color: 'var(--forest)', marginBottom: 8 }}>Kota Tujuan</label>
                <SearchSelect value={to} onChange={setTo} options={CITIES} placeholder="Pilih Kota Tujuan" />
              </div>
            </div>
            <div style={{ marginBottom: 16 }}>
              <label style={{ display: 'block', fontWeight: 700, fontSize: '0.9rem', color: 'var(--forest)', marginBottom: 8 }}>Berat (gram)</label>
              <input type="number" min="1" max="30000" value={weight} onChange={e => setWeight(Number(e.target.value))} />
            </div>
            <button className="btn-primary" onClick={handleCalc} disabled={loading || !from || !to} style={{ width: '100%', opacity: loading || !from || !to ? 0.6 : 1 }}>
              {loading ? 'Menghitung...' : '💰 Hitung Ongkir'}
            </button>
          </div>

          {error && <div style={{ marginTop: 16, padding: '12px 16px', background: '#fef2f2', border: '1px solid #fca5a5', borderRadius: 8, color: '#dc2626', fontSize: '0.9rem' }}>⚠️ {error}</div>}

          {results.length > 0 && (
            <div style={{ marginTop: 24 }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: 16 }}>
                {results.map((r, i) => (
                  <div key={r.id} className="cost-card">
                    {i === 0 && <div className="best-badge">TERCEPAT</div>}
                    <div className="courier-name">{r.name}</div>
                    <div className="price">Rp {r.price.toLocaleString('id-ID')}</div>
                    <div className="eta">Estimasi {r.days}</div>
                    <div style={{ marginTop: 8 }}>
                      <span style={{ display: 'inline-block', padding: '2px 8px', background: r.source === 'api' ? '#22c55e' : '#f59e0b', color: '#fff', borderRadius: 4, fontSize: '0.65rem', fontWeight: 700 }}>
                        {r.source === 'api' ? '✓ REAL API' : 'ESTIMASI'}
                      </span>
                    </div>
                    <div className="cost-breakdown">
                      <div><div className="label">Berat</div><div className="value">{weight}g</div></div>
                      <div><div className="label">Asal</div><div className="value">{CITIES.find(c => c.id === from)?.name}</div></div>
                      <div><div className="label">Tujuan</div><div className="value">{CITIES.find(c => c.id === to)?.name}</div></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

          <div className="section-title">
            <h2>📚 API Dokumentasi</h2>
            <p>Integrasikan LacakOngkir ke sistem Anda dengan API yang simpel dan akurat</p>
          </div>

          {!auth.user && (
            <div className="card" style={{ marginBottom: 24, background: 'var(--light-tint)', border: '2px solid var(--amber)' }}>
              <div style={{ fontWeight: 700, color: 'var(--forest)', marginBottom: 8 }}>🔐 Butuh API Key</div>
              <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: 12 }}>Daftar gratis untuk mendapatkan API key yang bisa Anda gunakan untuk integrasi.</p>
              <button className="btn-primary" onClick={() => auth.showAuth('register')}>Daftar Gratis</button>
            </div>
          )}

          {auth.user && (
            <div className="api-key-box">
              <div className="api-key-label">API Key Anda</div>
              <div className="api-key-value">{apiKey.substring(0, 20)}...{apiKey.substring(apiKey.length - 8)}</div>
              <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: 8 }}>Gunakan header <code style={{ background: 'white', padding: '2px 6px', borderRadius: 4 }}>X-API-Key: {apiKey}</code> pada setiap request</div>
            </div>
          )}

          <div className="docs-nav">
            <button className={`docs-nav-btn ${activeTab === 'overview' ? 'active' : ''}`} onClick={() => setActiveTab('overview')}>Overview</button>
            <button className={`docs-nav-btn ${activeTab === 'cost' ? 'active' : ''}`} onClick={() => setActiveTab('cost')}>Cek Ongkir</button>
            <button className={`docs-nav-btn ${activeTab === 'track' ? 'active' : ''}`} onClick={() => setActiveTab('track')}>Lacak Paket</button>
            <button className={`docs-nav-btn ${activeTab === 'couriers' ? 'active' : ''}`} onClick={() => setActiveTab('couriers')}>Daftar Kurir</button>
            <button className={`docs-nav-btn ${activeTab === 'cities' ? 'active' : ''}`} onClick={() => setActiveTab('cities')}>Daftar Kota</button>
          </div>

          {activeTab === 'overview' && (
            <div>
              <div className="card" style={{ marginBottom: 20 }}>
                <h3 style={{ color: 'var(--forest)', marginBottom: 12 }}>Base URL</h3>
                <div className="docs-code">https://expedisi.aplikasirt.my.id/api/v1</div>
              </div>
              <div className="card" style={{ marginBottom: 20 }}>
                <h3 style={{ color: 'var(--forest)', marginBottom: 12 }}>Authentication</h3>
                <p style={{ color: 'var(--text-muted)', marginBottom: 12 }}>Semua request memerlukan API key yang bisa Anda dapatkan setelah registrasi. Gunakan header:</p>
                <div className="docs-code">X-API-Key: <span className="string">exp_api_your_api_key_here</span></div>
              </div>
              <div className="card">
                <h3 style={{ color: 'var(--forest)', marginBottom: 12 }}>Response Format</h3>
                <p style={{ color: 'var(--text-muted)', marginBottom: 12 }}>Semua response dalam format JSON:</p>
                <div className="docs-code">{`{`}<br/>
                {'  '}<span className="string">"success"</span>: <span className="keyword">true</span>,<br/>
                {'  '}<span className="string">"data"</span>: {'{'} ... {'}'}<br/>
                {`}`}</div>
              </div>
            </div>
          )}

          {activeTab === 'cost' && (
            <div>
              <ExampleCode method="GET" path="/api/v1/cost"
                params={[
                  { name: 'origin', type: 'string', desc: 'Kode kota asal (contoh: bekasi, jakartatimur)' },
                  { name: 'destination', type: 'string', desc: 'Kode kota tujuan' },
                  { name: 'weight', type: 'integer', desc: 'Berat dalam gram (1-30000)' },
                  { name: 'courier', type: 'string', desc: 'Filter kurir (opsional): jne, jnt, sicepat, anteraja, ninja, pos, tiki, spx' },
                ]}
                response={`<span class="comment">// Request</span>
<span class="method">GET</span> /api/v1/cost?origin=bekasi&destination=jakartatimur&weight=1000

<span class="comment">// Response</span>
{
  <span class="string">"success"</span>: <span class="keyword">true</span>,
  <span class="string">"origin"</span>: { <span class="string">"city"</span>: <span class="string">"bekasi"</span>, <span class="string">"code"</span>: <span class="string">"3275011001"</span> },
  <span class="string">"destination"</span>: { <span class="string">"city"</span>: <span class="string">"jakartatimur"</span>, <span class="string">"code"</span>: <span class="string">"3175061007"</span> },
  <span class="string">"weight"</span>: <span class="keyword">1000</span>,
  <span class="string">"couriers"</span>: [
    {
      <span class="string">"courier_code"</span>: <span class="string">"jne"</span>,
      <span class="string">"courier_name"</span>: <span class="string">"JNE"</span>,
      <span class="string">"services"</span>: [
        { <span class="string">"service_code"</span>: <span class="string">"REG"</span>, <span class="string">"price"</span>: <span class="keyword">10000</span>, <span class="string">"etd"</span>: <span class="string">"1-2"</span> }
      ]
    }
  ]
}`}
              />
            </div>
          )}

          {activeTab === 'track' && (
            <div>
              <ExampleCode method="GET" path="/api/v1/track"
                params={[
                  { name: 'awb', type: 'string', desc: 'Nomor resi / AWB paket' },
                  { name: 'courier', type: 'string', desc: 'Kode kurir: jne, jnt, sicepat, anteraja, ninja, pos, tiki, spx' },
                ]}
                response={`<span class="comment">// Request</span>
<span class="method">GET</span> /api/v1/track?awb=JP1234567890&courier=jne

<span class="comment">// Response</span>
{
  <span class="string">"success"</span>: <span class="keyword">true</span>,
  <span class="string">"awb"</span>: <span class="string">"JP1234567890"</span>,
  <span class="string">"courier"</span>: <span class="string">"jne"</span>,
  <span class="string">"status"</span>: <span class="string">"in_transit"</span>,
  <span class="string">"history"</span>: [
    { <span class="string">"date"</span>: <span class="string">"17 Jun 2026, 13:20"</span>, <span class="string">"status"</span>: <span class="string">"Paket diterima"</span>, <span class="string">"location"</span>: <span class="string">"Surabaya"</span> }
  ]
}`}
              />
            </div>
          )}

          {activeTab === 'couriers' && (
            <div>
              <ExampleCode method="GET" path="/api/v1/couriers"
                params={[]}
                response={`<span class="comment">// Response</span>
{
  <span class="string">"success"</span>: <span class="keyword">true</span>,
  <span class="string">"couriers"</span>: [
    { <span class="string">"code"</span>: <span class="string">"jne"</span>, <span class="string">"name"</span>: <span class="string">"JNE"</span> },
    { <span class="string">"code"</span>: <span class="string">"jnt"</span>, <span class="string">"name"</span>: <span class="string">"J&T Express"</span> },
    { <span class="string">"code"</span>: <span class="string">"sicepat"</span>, <span class="string">"name"</span>: <span class="string">"SiCepat"</span> },
    ...
  ]
}`}
              />
            </div>
          )}

          {activeTab === 'cities' && (
            <div>
              <ExampleCode method="GET" path="/api/v1/cities"
                params={[]}
                response={`<span class="comment">// Response</span>
{
  <span class="string">"success"</span>: <span class="keyword">true</span>,
  <span class="string">"cities"</span>: [
    { <span class="string">"id"</span>: <span class="string">"bekasi"</span>, <span class="string">"name"</span>: <span class="string">"Bekasi"</span>, <span class="string">"province"</span>: <span class="string">"Jawa Barat"</span> },
    { <span class="string">"id"</span>: <span class="string">"jakartatimur"</span>, <span class="string">"name"</span>: <span class="string">"Jakarta Timur"</span>, <span class="string">"province"</span>: <span class="string">"DKI Jakarta"</span> },
    ...
  ]
}`}
              />
              <div className="card" style={{ marginTop: 16 }}>
                <h4 style={{ color: 'var(--forest)', marginBottom: 10 }}>Kode Kota yang Tersedia</h4>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: 8 }}>
                  {CITIES.map(c => (
                    <div key={c.id} style={{ background: 'var(--cream)', padding: '6px 10px', borderRadius: 8, fontSize: '0.82rem' }}>
                      <code style={{ color: 'var(--forest)', fontWeight: 600 }}>{c.id}</code>
                      <span style={{ color: 'var(--text-muted)' }}> — {c.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── Dashboard Page ─────────────────────────────────────────────────────────
    function DashboardPage() {
      const auth = useAuth();
      const user = auth.user;
      const [keys, setKeys] = React.useState([]);
      const [newKeyName, setNewKeyName] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [toast, setToast] = React.useState(null);

      const token = localStorage.getItem('token');

      React.useEffect(() => {
        loadKeys();
      }, []);

      async function loadKeys() {
        try {
          const data = await apiGet('/keys.php', token);
          if (data.success) setKeys(data.keys || []);
        } catch (err) {
          console.error(err);
        }
      }

      async function createKey() {
        if (!newKeyName.trim()) return;
        setLoading(true);
        try {
          const data = await apiPost('/keys.php', { name: newKeyName }, token);
          if (data.success) {
            setToast({ message: 'API Key berhasil dibuat!', type: 'success' });
            setNewKeyName('');
            await loadKeys();
          }
        } catch (err) {
          setToast({ message: 'Gagal membuat key', type: 'error' });
        } finally {
          setLoading(false);
        }
      }

      async function revokeKey(keyId) {
        try {
          const data = await apiDelete('/keys.php', { id: keyId }, token);
          if (data.success) {
            setToast({ message: 'API Key berhasil direvoke', type: 'success' });
            await loadKeys();
          }
        } catch (err) {
          setToast({ message: 'Gagal revoke key', type: 'error' });
        }
      }

      const primaryKey = keys.find(k => k.is_active) || null;

      return (
        <div className="section">
          {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

          <div className="section-title" style={{ textAlign: 'left', marginBottom: 32 }}>
            <h2>⚙️ Dashboard</h2>
            <p>Selamat datang, <strong>{user?.name}</strong> ({user?.email})</p>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24, marginBottom: 32 }}>
            <div className="card">
              <h3 style={{ color: 'var(--forest)', marginBottom: 20, fontSize: '1.2rem' }}>📊 Statistik</h3>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                <div style={{ background: 'var(--cream)', borderRadius: 12, padding: 16, textAlign: 'center' }}>
                  <div style={{ fontSize: '2rem', fontWeight: 800, color: 'var(--forest)' }}>{keys.length}</div>
                  <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>Total API Keys</div>
                </div>
                <div style={{ background: 'var(--cream)', borderRadius: 12, padding: 16, textAlign: 'center' }}>
                  <div style={{ fontSize: '2rem', fontWeight: 800, color: 'var(--amber)' }}>0</div>
                  <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)' }}>API Calls (bulan ini)</div>
                </div>
              </div>
            </div>

            <div className="card">
              <h3 style={{ color: 'var(--forest)', marginBottom: 20, fontSize: '1.2rem' }}>➕ Buat API Key Baru</h3>
              <div style={{ display: 'flex', gap: 10 }}>
                <input type="text" value={newKeyName} onChange={e => setNewKeyName(e.target.value)} placeholder="Nama key (contoh: Production Server)" onKeyDown={e => e.key === 'Enter' && createKey()} />
                <button className="btn-secondary" onClick={createKey} disabled={loading || !newKeyName.trim()} style={{ whiteSpace: 'nowrap' }}>
                  {loading ? '...' : 'Buat'}
                </button>
              </div>
            </div>
          </div>

          {primaryKey && (
            <div className="api-key-box">
              <div className="api-key-label">🔑 Primary API Key</div>
              <div className="api-key-value">{localStorage.getItem('apiKey') || localStorage.getItem('token')}</div>
              <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: 8 }}>Dibuat: {new Date(primaryKey.created_at).toLocaleDateString('id-ID')} · Terakhir dipakai: {primaryKey.last_used_at ? new Date(primaryKey.last_used_at).toLocaleDateString('id-ID') : 'Belum pernah'}</div>
              <div className="api-key-actions">
                <button className="btn-secondary" onClick={() => { navigator.clipboard.writeText(localStorage.getItem('apiKey') || localStorage.getItem('token')); setToast({ message: 'API Key copied!', type: 'success' }); }}>
                  📋 Copy
                </button>
                <button className="btn-danger" onClick={() => revokeKey(primaryKey.id)}>🗑️ Revoke</button>
              </div>
            </div>
          )}

          <h3 style={{ color: 'var(--forest)', marginBottom: 16 }}>📋 Semua API Keys</h3>
          {keys.length === 0 ? (
            <div className="card" style={{ textAlign: 'center', color: 'var(--text-muted)' }}>
              Belum ada API key. Buat key baru di atas.
            </div>
          ) : (
            <div className="key-list">
              {keys.map(key => (
                <div key={key.id} className="key-item">
                  <div className="key-item-info">
                    <div className="key-item-name">{key.name} {!key.is_active && <span style={{ color: 'var(--danger)', fontSize: '0.8rem' }}>(Revoked)</span>}</div>
                    <div className="key-item-meta">Dibuat: {new Date(key.created_at).toLocaleDateString('id-ID')}</div>
                  </div>
                  <div className="key-item-prefix">{key.key_prefix}...****</div>
                  {key.is_active && (
                    <button className="btn-danger" onClick={() => revokeKey(key.id)} style={{ marginLeft: 12 }}>Revoke</button>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ─── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const [user, setUser] = React.useState(() => {
        const saved = localStorage.getItem('user');
        return saved ? JSON.parse(saved) : null;
      });
      const [activePage, setActivePage] = React.useState('home');
      const [activeTab, setActiveTab] = React.useState('tracking');
      const [showAuth, setShowAuth] = React.useState(false);
      const [authMode, setAuthMode] = React.useState('login');

      function handleLogin() {
        setShowAuth(true);
        setAuthMode('login');
      }

      function handleRegister() {
        setShowAuth(true);
        setAuthMode('register');
      }

      function handleAuthSuccess(userData, token, apiKey) {
        setUser(userData);
        setShowAuth(false);
        if (apiKey) localStorage.setItem('apiKey', apiKey);
      }

      function handleLogout() {
        localStorage.removeItem('user');
        localStorage.removeItem('token');
        localStorage.removeItem('apiKey');
        setUser(null);
        setActivePage('home');
      }

      const authValue = {
        user,
        showAuth: handleLogin,
        showRegister: handleRegister,
        logout: handleLogout,
        setActivePage,
      };

      return (
        <AuthContext.Provider value={authValue}>
          <Navbar user={user} onLoginClick={handleLogin} onLogout={handleLogout} />

          {showAuth && (
            <AuthModal
              isRegister={authMode === 'register'}
              onClose={() => setShowAuth(false)}
              onSwitch={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
              onSuccess={handleAuthSuccess}
            />
          )}

          {activePage === 'docs' && <DocsPage />}
          {activePage === 'dashboard' && <DashboardPage />}
          {activePage === 'home' && (
            <>
              <Hero />
              <section className="section">
                <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginBottom: 36 }}>
                  <button className="tab-btn" style={{ background: activeTab === 'tracking' ? 'var(--forest)' : 'transparent', color: activeTab === 'tracking' ? 'white' : 'var(--forest)', borderColor: activeTab === 'tracking' ? 'var(--forest)' : 'var(--border)' }} onClick={() => setActiveTab('tracking')}>🔍 Lacak Paket</button>
                  <button className="tab-btn" style={{ background: activeTab === 'ongkir' ? 'var(--forest)' : 'transparent', color: activeTab === 'ongkir' ? 'white' : 'var(--forest)', borderColor: activeTab === 'ongkir' ? 'var(--forest)' : 'var(--border)' }} onClick={() => setActiveTab('ongkir')}>💰 Kalkulator Ongkir</button>
                </div>
                {activeTab === 'tracking' && <TrackingTab />}
                {activeTab === 'ongkir' && <OngkirTab />}
              </section>
              <div className="divider"><div className="divider-line"></div><div className="divider-dot"></div><div className="divider-line"></div></div>
              <section className="section" id="ekspedisi">
                <div className="section-title">
                  <h2>Partner Ekspedisi</h2>
                  <p>8 kurir ternama Indonesia dalam satu platform</p>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: 20 }}>
                  {COURIERS.map(c => (
                    <div key={c.id} className="card" style={{ padding: 0, overflow: 'hidden' }}>
                      <div style={{ background: 'linear-gradient(135deg, var(--forest) 0%, #0d6e3a 100%)', padding: '20px 20px 16px', display: 'flex', alignItems: 'center', gap: 14 }}>
                        <img src={c.logo} alt={c.name} style={{ width: 52, height: 52, objectFit: 'contain', flexShrink: 0, background: '#fff', borderRadius: 8, padding: 4 }} onError={e => { e.target.style.display = 'none' }} />
                        <div>
                          <div style={{ fontWeight: 900, color: '#fff', fontSize: '1.15rem' }}>{c.name}</div>
                          <div style={{ fontSize: '0.75rem', color: 'rgba(255,255,255,0.8)', marginTop: 2 }}>{c.tagline}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
              <footer className="footer">
                <p>🇮🇩 <strong>LacakOngkir</strong> — Platform tracking & kalkulator ongkir Indonesia</p>
                <p style={{ marginTop: 6 }}>© 2026 · API powered by api.co.id</p>
              </footer>
            </>
          )}
        </AuthContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
