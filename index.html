<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LacakOngkir — Expedisi Indonesia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --forest: #084823;
      --green-mid: #0a5c2e;
      --amber: #D4A843;
      --orange: #C4622D;
      --cream: #FAF4EB;
      --light-tint: #f0f7f4;
      --text-dark: #1a1a1a;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 4px 20px rgba(8,72,35,0.12);
      --shadow-lg: 0 8px 40px rgba(8,72,35,0.18);
      --danger: #dc2626;
      --success: #16a34a;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--cream);
      color: var(--text-dark);
      min-height: 100vh;
      line-height: 1.6;
    }

    h1, h2, h3 { font-family: 'Playfair Display', serif; }

    .btn-primary {
      background-color: var(--orange);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(196,98,45,0.35);
      font-family: inherit;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background-color: var(--green-mid);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 22px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(10,92,46,0.3);
      font-family: inherit;
    }
    .btn-secondary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--forest);
      border: 2px solid var(--forest);
      border-radius: 12px;
      padding: 10px 22px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-ghost:hover { background: var(--forest); color: white; }

    .btn-danger {
      background-color: var(--danger);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-danger:hover { opacity: 0.9; }

    input, select {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-family: inherit;
      background: white;
      color: var(--text-dark);
      transition: border-color 0.2s;
      width: 100%;
      outline: none;
      box-sizing: border-box;
    }
    input:focus, select:focus { border-color: var(--green-mid); }
    input::placeholder { color: #9ca3af; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .tab-btn {
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
      font-family: inherit;
    }

    /* Navbar */
    .navbar {
      background: var(--forest);
      padding: 0 40px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.2);
    }
    .navbar-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: white;
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .navbar-logo span { color: var(--amber); }
    .navbar-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .navbar-links a {
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .navbar-links a:hover, .navbar-links a.active { color: white; background: rgba(255,255,255,0.1); }

    /* User menu */
    .user-menu { position: relative; }
    .user-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .user-btn:hover { background: rgba(255,255,255,0.2); }
    .user-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: white;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      min-width: 220px;
      overflow: hidden;
      z-index: 999;
    }
    .user-dropdown-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .user-dropdown-name { font-weight: 700; color: var(--text-dark); font-size: 0.95rem; }
    .user-dropdown-email { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .user-dropdown-item {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      color: var(--text-dark);
      font-size: 0.9rem;
      transition: background 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .user-dropdown-item:hover { background: var(--light-tint); }
    .user-dropdown-item.danger { color: var(--danger); }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--forest) 0%, var(--green-mid) 60%, #2d7a4a 100%);
      padding: 64px 40px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-content { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212,168,67,0.18);
      border: 1px solid rgba(212,168,67,0.4);
      color: var(--amber);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
    }
    .hero h1 { color: white; font-size: 2.8rem; line-height: 1.15; margin-bottom: 16px; }
    .hero p { color: rgba(255,255,255,0.8); font-size: 1.1rem; max-width: 480px; margin: 0 auto 32px; }
    .hero-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      line-height: 0;
      overflow: hidden;
    }
    .hero-wave svg { display: block; width: 100%; height: 100%; }

    .section { max-width: 1100px; margin: 0 auto; padding: 48px 24px; }
    .section-title { text-align: center; margin-bottom: 40px; }
    .section-title h2 { font-size: 2rem; color: var(--forest); margin-bottom: 10px; }
    .section-title p { color: var(--text-muted); font-size: 1rem; }
    .divider { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 20px 0; }
    .divider-line { width: 60px; height: 1px; background: var(--amber); }
    .divider-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }

    /* Expedition grid */
    .expedition-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .expedition-card {
      background: white;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .expedition-card:hover { border-color: var(--green-mid); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(10,92,46,0.12); }
    .expedition-card.selected { border-color: var(--green-mid); background: var(--light-tint); box-shadow: 0 0 0 3px rgba(10,92,46,0.15); }
    .expedition-card img { width: 52px; height: 52px; object-fit: contain; margin-bottom: 10px; }
    .expedition-card .name { font-weight: 700; font-size: 0.88rem; color: var(--forest); }
    .expedition-card .type { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

    /* Tracking result */
    .tracking-result { background: white; border-radius: 20px; padding: 28px; box-shadow: var(--shadow); margin-top: 24px; }
    .tracking-header { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 20px; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    .tracking-awb { font-size: 1.1rem; font-weight: 800; color: var(--forest); }
    .tracking-courier { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .tracking-status-badge {
      margin-left: auto;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 6px;
      bottom: 6px;
      width: 2px;
      background: var(--border);
    }
    .timeline-item { position: relative; padding-bottom: 24px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot {
      position: absolute;
      left: -25px;
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 2px var(--border);
      background: white;
      z-index: 1;
    }
    .timeline-item:first-child .timeline-dot { box-shadow: 0 0 0 3px var(--green-mid); background: var(--green-mid); }
    .timeline-date { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }
    .timeline-title { font-weight: 700; font-size: 0.95rem; color: var(--text-dark); margin: 2px 0; }
    .timeline-desc { font-size: 0.85rem; color: var(--text-muted); }

    /* Cost card */
    .cost-card {
      background: linear-gradient(135deg, var(--forest), var(--green-mid));
      border-radius: 20px;
      padding: 28px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .cost-card .courier-name { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
    .cost-card .price { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 800; color: var(--amber); }
    .cost-card .eta { font-size: 0.9rem; color: rgba(255,255,255,0.8); margin-top: 4px; }
    .cost-breakdown { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.2); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cost-breakdown .label { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
    .cost-breakdown .value { font-size: 0.85rem; font-weight: 600; }
    .best-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--amber);
      color: var(--forest);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 100px;
      letter-spacing: 0.5px;
    }

    /* Footer */
    .footer { background: var(--forest); color: rgba(255,255,255,0.7); text-align: center; padding: 32px 24px; font-size: 0.88rem; }
    .footer strong { color: var(--amber); }

    /* Auth Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal {
      background: white;
      border-radius: 20px;
      padding: 36px;
      max-width: 440px;
      width: 90%;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--cream); color: var(--text-dark); }
    .modal-title { font-size: 1.6rem; color: var(--forest); margin-bottom: 8px; }
    .modal-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-weight: 600; font-size: 0.88rem; color: var(--forest); margin-bottom: 6px; }
    .form-error { background: #fef2f2; border: 1px solid #fca5a5; color: var(--danger); padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 16px; }
    .form-success { background: #f0fdf4; border: 1px solid #86efac; color: var(--success); padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 16px; }
    .auth-switch { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
    .auth-switch a { color: var(--forest); font-weight: 600; cursor: pointer; text-decoration: underline; }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 20px;
      background: #fff;
      border: 2px solid #dadce0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #3c4043;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-bottom: 20px;
    }
    .google-btn:hover { background: #f8f9fa; border-color: #c2c7cc; }
    .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .google-btn svg { width: 20px; height: 20px; }

    .divider-or {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .divider-or::before, .divider-or::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .verify-screen { text-align: center; padding: 12px 0; }
    .verify-icon {
      width: 72px;
      height: 72px;
      background: var(--light-tint);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.2rem;
    }
    .verify-email {
      font-family: monospace;
      background: var(--cream);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--forest);
      font-weight: 600;
      display: inline-block;
      margin: 8px 0 20px;
      word-break: break-all;
    }
    .verify-actions { display: flex; flex-direction: column; gap: 10px; }

    .unverified-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.88rem;
      color: var(--forest);
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }

    /* API Key Dashboard */
    .api-key-box {
      background: var(--light-tint);
      border: 2px dashed var(--amber);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .api-key-label { font-size: 0.78rem; font-weight: 700; color: var(--amber); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .api-key-value {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--forest);
      word-break: break-all;
      background: white;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .api-key-actions { display: flex; gap: 8px; margin-top: 12px; }

    .key-list { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
    .key-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
    }
    .key-item-info { flex: 1; }
    .key-item-name { font-weight: 700; color: var(--forest); font-size: 0.95rem; }
    .key-item-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .key-item-prefix { font-family: 'Courier New', monospace; font-size: 0.85rem; color: var(--text-muted); }

    /* Admin */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: white; border-radius: 16px; padding: 24px; box-shadow: var(--shadow); text-align: center; }
    .stat-value { font-size: 2.2rem; font-weight: 800; color: var(--forest); }
    .stat-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    .admin-table-wrap { overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th { text-align: left; padding: 12px 16px; background: var(--cream); border-bottom: 2px solid var(--border); font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .admin-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .admin-table tr:hover td { background: var(--light-tint); }
    .role-badge { display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .role-badge.admin { background: #fef3c7; color: #92400e; }
    .role-badge.member { background: var(--light-tint); color: var(--green-mid); }
    .verified-badge { display: inline-flex; align-items: center; gap: 4px; color: var(--success); font-size: 0.82rem; font-weight: 600; }
    .verified-badge.unverified { color: var(--danger); }
    .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 24px; }

    /* Docs */
    .docs-nav { display: flex; gap: 8px; margin-bottom: 32px; flex-wrap: wrap; }
    .docs-nav-btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid var(--border);
      background: white;
      color: var(--text-muted);
      transition: all 0.2s;
      font-family: inherit;
    }
    .docs-nav-btn:hover { border-color: var(--green-mid); color: var(--green-mid); }
    .docs-nav-btn.active { background: var(--forest); border-color: var(--forest); color: white; }

    .docs-code {
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      font-family: 'Courier New', monospace;
      font-size: 0.88rem;
      overflow-x: auto;
      margin: 12px 0;
      line-height: 1.6;
    }
    .docs-code .comment { color: #64748b; }
    .docs-code .string { color: #86efac; }
    .docs-code .keyword { color: #f472b6; }
    .docs-code .method { color: #60a5fa; }

    .endpoint-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .endpoint-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .method-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      font-family: monospace;
    }
    .method-badge.get { background: #dbeafe; color: #1e40af; }
    .method-badge.post { background: #d1fae5; color: #065f46; }
    .method-badge.delete { background: #fee2e2; color: #991b1b; }
    .endpoint-path { font-family: monospace; font-size: 0.95rem; font-weight: 600; color: var(--text-dark); }
    .endpoint-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; }

    .param-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
